<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fittfi — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream:   #F0EDE7;
      --cream-2: #E6E3DA;
      --gold:    #B08A3E;
      --gold-lt: #C9A455;
      --ink:     #1A1714;
      --ink-2:   #5C564E;
      --rule:    rgba(26,23,20,0.10);
      --serif: 'DM Serif Display', Georgia, serif;
      --sans:  'DM Sans', system-ui, sans-serif;
      --radius-pill: 50px;
      --radius-card: 16px;
      --gutter: clamp(1.5rem, 8vw, 6rem);
    }
    body {
      font-family: var(--sans);
      font-weight: 300;
      color: var(--ink);
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    nav {
      background: rgba(240,237,231,0.96);
      border-bottom: 0.5px solid var(--rule);
    }
    .nav-inner {
      width: 100%;
      padding: 0 var(--gutter);
      display: flex;
      align-items: center;
      height: 48px;
    }
    .nav-logo {
      font-family: var(--serif);
      font-size: 1.7rem;
      color: var(--ink);
      text-decoration: none;
      font-weight: 400;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem var(--gutter);
    }
    .card {
      background: #fff;
      border-radius: var(--radius-card);
      box-shadow: 0 1px 4px rgba(26,23,20,0.06), 0 0 0 0.5px rgba(26,23,20,0.06);
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .card p.eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: var(--serif);
      font-size: 1.6rem;
      line-height: 1.25;
      margin-bottom: 0.9rem;
    }
    .card p.body {
      font-size: 14.5px;
      color: var(--ink-2);
      margin-bottom: 1.75rem;
      line-height: 1.65;
    }
    a.btn {
      display: inline-block;
      padding: 14px 30px;
      background: var(--gold);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: var(--radius-pill);
      transition: background 0.15s;
    }
    a.btn:hover { background: var(--gold-lt); }
    .back {
      display: block;
      margin-top: 1.5rem;
      font-size: 12px;
      color: var(--ink-2);
      text-decoration: none;
    }
    .back:hover { color: var(--ink); }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="nav-logo" href="/">Fittfi</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <p class="eyebrow">Member login</p>
      <h1>Member accounts are coming soon.</h1>
      <p class="body">We're building this in the open, and founding members get early access first. If you've already applied, Henny will reach out personally. Otherwise, apply below to join the first 100.</p>
      <a href="index.html#founding" class="btn">Apply for founding membership</a>
      <a href="index.html" class="back">← Back to Fittfi</a>
    </div>
  </main>

</body>
</html>
